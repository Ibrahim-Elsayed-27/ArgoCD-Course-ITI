apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: profile-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ibrahim-Elsayed-27/ArgoCD-Course-ITI.git
    targetRevision: gym-profile-service
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: gym
  syncPolicy:
    automated:
      prune: true       # deletes resources removed from git
      selfHeal: true    # reverts manual cluster drift
    syncOptions:
      - CreateNamespace=true
