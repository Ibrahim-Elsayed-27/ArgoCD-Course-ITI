apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp-standard
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false

# NOTE:
# - This StorageClass uses the "no-provisioner" driver (suitable for environments
#   where PersistentVolumes are provided manually or by a local-path provisioner).
# - Replace `provisioner` with your cloud provider's dynamic provisioner
#   (e.g. kubernetes.io/aws-ebs, ebs.csi.aws.com, pd.csi.storage.gke.io) for production.
